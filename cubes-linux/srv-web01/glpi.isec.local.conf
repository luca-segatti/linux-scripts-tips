# Fichier à mettre sur srv-web01 dans /etc/apache2/sites-available/glpi.isec.local.conf
<VirtualHost *:80>                                                                                                   
    ServerName glpi.isec.local
    DocumentRoot /var/www/glpi.isec.local
    ErrorLog ${APACHE_LOG_DIR}/glpi_error.log
    CustomLog ${APACHE_LOG_DIR}/glpi_access.log combined
</VirtualHost>
