<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLPI - Connexion</title>
<style>
  :root {
    --page-bg: #f3f5f9;
    --card-border: #e3e7ee;
    --text-dark: #2f3b52;
    --text-muted: #5a6a85;
    --input-border: #d7dde6;
    --focus-teal: #4fb3a9;
    --accent-orange: #f5a940;
    --accent-orange-dark: #eb9b2c;
    --footer-blue: #7c8db5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page-bg);
    font-family: "Noto Sans", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--text-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 70px 16px 30px;
  }

  .glpi-logo {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 36px;
  }

  .glpi-logo img {
    height: 72px;
    width: auto;
  }

  .login-card {
    width: 100%;
    max-width: 570px;
    background: #ffffff;
    border: 1px solid var(--card-border);
    border-radius: 6px;
    box-shadow: 0 2px 10px rgba(30, 45, 70, 0.06);
    padding: 32px 40px 36px;
  }

	  .login-card h2 {
    text-align: center;
    font-size: 21px;
    font-weight: 700;
    margin: 4px 0 18px;
    color: var(--text-dark);
  }

  .divider {
    border: none;
    border-top: 1px solid var(--card-border);
    margin: 0 0 22px;
  }

  .field { margin-bottom: 18px; }

  .field label {
    display: block;
    font-size: 14px;
    color: var(--text-dark);
    margin-bottom: 7px;
  }

  .field input[type="text"],
  .field input[type="password"] {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--input-border);
    border-radius: 4px;
    font-size: 14px;
    color: var(--text-dark);
    background: #fff;
  }

  .field input:focus {
    outline: none;
    border-color: var(--focus-teal);
    box-shadow: 0 0 0 3px rgba(79, 179, 169, 0.18);
  }

  .select-wrap {
    position: relative;
  }

  .select-wrap select {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    padding: 9px 34px 9px 12px;
    border: 1px solid var(--input-border);
    border-radius: 4px;
    font-size: 14px;
    color: var(--text-dark);

		  .select-wrap::after {
    content: "";
    position: absolute;
    right: 14px;
    top: 50%;
    width: 0;
    height: 0;
    transform: translateY(-50%);
    border-left: 5px solid transparent;
    border-right: 5px solid transparent;
    border-top: 6px solid var(--text-muted);
    pointer-events: none;
  }

  .remember-row {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 20px 0 24px;
  }

  .remember-row input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 3px;
    border: 1px solid var(--input-border);
    background: #fff;
    cursor: pointer;
    display: grid;
    place-content: center;
  }

  .remember-row input[type="checkbox"]:checked {
    background: var(--accent-orange);
    border-color: var(--accent-orange);
  }

  .remember-row input[type="checkbox"]:checked::after {
    content: "";
    width: 5px;
    height: 9px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) translate(-1px, -1px);
  }

	  .remember-row label {
    font-size: 14px;
    color: var(--text-dark);
    cursor: pointer;
  }

  .btn-submit {
    width: 100%;
    background: var(--accent-orange);
    color: #4a3106;
    border: none;
    padding: 12px;
    border-radius: 4px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }

  .btn-submit:hover { background: var(--accent-orange-dark); }

  .footer-copyright {
    text-align: center;
    margin-top: 22px;
    font-size: 13px;
    color: var(--footer-blue);
  }

  .demo-tag {
    text-align: center;
    margin-top: 8px;
    font-size: 11px;
    color: #a3aec4;
  }
</style>
</head>
<body>

  <div class="glpi-logo">
    <img src="https://raw.githubusercontent.com/glpi-project/glpi/main/public/pics/logos/logo-GLPI-250-black.png" al>
  </div>

  <div class="login-card">
    <h2>Connexion à votre compte</h2>
    <hr class="divider">

		    <form onsubmit="return false;">
      <div class="field">
        <label for="login">Identifiant</label>
        <input type="text" id="login" name="login" autocomplete="username" autofocus>
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
      </div>

      <div class="field">
        <label for="source">Source de connexion</label>
        <div class="select-wrap">
          <select id="source" name="source">
            <option>Base interne GLPI</option>
            <option>Annuaire LDAP</option>
            <option>Serveur mail (IMAP)</option>
          </select>
        </div>
      </div>

      <div class="remember-row">
        <input type="checkbox" id="remember" checked>
        <label for="remember">Se souvenir de moi</label>
      </div>

      <button type="submit" class="btn-submit">Se connecter</button>
    </form>
  </div>

  <div class="footer-copyright">GLPI Copyright (C) 2015-2025 Teclib' and contributors</div>
  <div class="demo-tag">Page de démonstration — aucune authentification réelle</div>

</body>
</html>
